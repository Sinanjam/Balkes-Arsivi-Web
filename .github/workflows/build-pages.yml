name: Build Balkes Arşivi Web

on:
  workflow_dispatch:
  repository_dispatch:
    types: [balkes-archive-updated]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Checkout full main archive repo
        uses: actions/checkout@v4
        with:
          repository: Sinanjam/Balkes-Arsivi
          path: mainrepo
          fetch-depth: 1

      - name: Build full static site from app repo
        run: python3 tools/build_full_site.py mainrepo public

      - name: Assert full data exists
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          items=json.loads(Path("public/data/items.json").read_text(encoding="utf-8"))
          photos=sum(len(x.get("photos",[])) for x in items)
          tables=sum(len(x.get("tables",[])) for x in items)
          print("items=",len(items),"photos=",photos,"tables=",tables)
          assert len(items) > 10
          assert photos > 10
          assert Path("public/assets/archive/archive_items.json").exists()
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
