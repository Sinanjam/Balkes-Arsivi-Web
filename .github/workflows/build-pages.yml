name: Build Balkes Arşivi Web

on:
  workflow_dispatch:
  repository_dispatch:
    types: [balkes-archive-updated]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4
      - name: Checkout main archive repo
        uses: actions/checkout@v4
        with:
          repository: Sinanjam/Balkes-Arsivi
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          path: mainrepo
      - name: Build static site
        run: python3 tools/build_site.py mainrepo public
          python3 tools/post_clean_site.py public
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
